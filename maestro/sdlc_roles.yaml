                              curl -sf "$CSS_URL" | grep -q '@tailwind' && echo "CSS_FAIL" || echo "CSS_OK"
                              curl -sf -o /dev/null -w '%{http_code}\n' "http://localhost:8081$JS_URL"  # expect 200
                              curl -sf -o /dev/null -w '%{http_code}\n' "http://localhost:8081$CSS_URL" # expect 200
                              ```
                              FAIL if `JS_OK` is empty (bundle not served), `CSS_FAIL`
                              (PostCSS/Tailwind pipeline leaked through), or either
                              status code is not `200`. The hash changes on every build,
                              so do NOT hard-code `/static/bundle/main.js` in the smoke.
                        (iii) `curl -sf http://localhost:8081/ | grep -q 'static/bundle/main-'`
